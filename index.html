<style>
/* ============================================================
   Little Loop Studio — theme
   Change the palette and fonts here; everything else follows.
   ============================================================ */
:root {
  --bg: #FAF8F5;          /* warm off-white page */
  --surface: #FFFFFF;     /* cards & panels */
  --muted-bg: #F3EFE9;    /* image backdrops, quiet fills */
  --line: #EAE4DB;        /* hairline borders */
  --text: #3F2E24;        /* soft dark brown (no black) */
  --text-soft: #75655A;
  --sage: #8DA47A;
  --sage-deep: #4D6B50;   /* primary actions (AA on white) */
  --sage-tint: #EDF2E9;
  --terra: #B5683F;
  --terra-deep: #9C4E31;  /* links, small accents (AA) */
  --pink: #D9919B;        /* dusty pink hearts */
  --pink-deep: #A8566A;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 1px 2px rgba(63, 46, 36, .04), 0 8px 24px rgba(63, 46, 36, .06);
  --shadow-lift: 0 2px 4px rgba(63, 46, 36, .05), 0 16px 36px rgba(63, 46, 36, .10);
  --on-primary: #FFFFFF;
  --primary-hover: #435E46;
  --on-ink: #FFFFFF;
  --on-pink: #FFFFFF;
  --glass: rgba(250, 248, 245, .9);
  --glass-2: rgba(255, 255, 255, .94);
  --glass-strong: rgba(255, 255, 255, .9);
  --hover-line: #D9D0C3;
  --soft-hover: #ECE6DD;
  --box-border: #C9BCAB;
  --placeholder: #A39689;
  --track: #DDD5CA;
  color-scheme: light;
  --font-head: "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --header-h: 64px;
  --round-size: 1.15rem;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--header-h) + 72px); }
body {
  margin: 0; font-family: var(--font-body); font-size: 1rem; line-height: 1.6;
  color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
@media (min-width: 860px) { body { padding-bottom: 0; } }
img { max-width: 100%; display: block; }
a { color: var(--terra-deep); text-underline-offset: 3px; }
h1, h2, h3 { font-family: var(--font-head); font-weight: 800; line-height: 1.15; margin: 0 0 .5em; letter-spacing: -.015em; }
h1 { font-size: clamp(1.9rem, 5.5vw, 2.8rem); }
h2 { font-size: clamp(1.3rem, 3.5vw, 1.6rem); }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0 0 1em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--sage-deep); outline-offset: 3px; border-radius: 8px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.container { width: min(1120px, 100% - 40px); margin-inline: auto; }
.muted { color: var(--text-soft); }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--text); color: var(--on-ink); padding: 10px 16px; border-radius: 10px; text-decoration: none; }
.skip:focus { top: 10px; }

/* ---------- header & nav ---------- */
.site-header { position: sticky; top: 0; z-index: 40; background: var(--glass); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid transparent; transition: border-color .2s; }
.site-header.scrolled { border-bottom-color: var(--line); }
.site-header .container { display: flex; align-items: center; justify-content: space-between; height: var(--header-h); gap: 16px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-family: var(--font-head); font-weight: 800; font-size: 1.12rem; letter-spacing: -.01em; }
.logo svg { width: 28px; height: 28px; }
.nav { display: none; gap: 2px; }
.nav a, .tabbar a { text-decoration: none; color: var(--text-soft); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.nav a { padding: 8px 14px; min-height: 44px; border-radius: 999px; font-size: .95rem; }
.nav a:hover { color: var(--text); }
.nav a[aria-current="page"] { color: var(--text); background: var(--muted-bg); }
.count-badge { background: var(--pink-deep); color: var(--on-pink); font-size: .7rem; font-weight: 700; min-width: 18px; height: 18px; border-radius: 999px; display: inline-grid; place-items: center; padding: 0 5px; }
.count-badge[hidden] { display: none; }
@media (min-width: 860px) { .nav { display: flex; } .tabbar { display: none !important; } }

.tabbar { position: fixed; inset: auto 0 0 0; z-index: 45; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--glass-2); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 4px 8px calc(4px + env(safe-area-inset-bottom)); }
.tabbar a { flex-direction: column; justify-content: center; gap: 2px; font-size: .72rem; min-height: 56px; position: relative; }
.tabbar a svg { width: 24px; height: 24px; }
.tabbar a[aria-current="page"] { color: var(--sage-deep); }
.tabbar .count-badge { position: absolute; top: 4px; left: calc(50% + 5px); }

/* ---------- buttons, chips, inputs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; font-weight: 600; text-decoration: none; transition: background .2s, transform .2s var(--ease), border-color .2s; white-space: nowrap; }
.btn svg { width: 19px; height: 19px; flex: none; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--sage-deep); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-soft { background: var(--muted-bg); color: var(--text); }
.btn-soft:hover { background: var(--soft-hover); }
.btn-ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
.btn-ghost:hover { border-color: var(--hover-line); }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: .9rem; }
.btn-link { background: none; border: 0; color: var(--text-soft); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 8px 4px; min-height: 44px; font-size: .92rem; }
.btn-link:hover { color: var(--text); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; flex: none; color: var(--text-soft); }
.icon-btn:hover { background: var(--muted-bg); color: var(--text); }
.icon-btn svg { width: 20px; height: 20px; }

.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; font-size: .9rem; color: var(--text); white-space: nowrap; transition: background .2s, border-color .2s, color .2s; text-decoration: none; }
.chip:hover { border-color: var(--hover-line); }
.chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--on-ink); }
.chip .x { font-size: 1rem; line-height: 1; opacity: .7; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }

.search { position: relative; display: flex; align-items: center; }
.search svg { position: absolute; left: 16px; width: 20px; height: 20px; color: var(--text-soft); pointer-events: none; }
.search input { width: 100%; min-height: 50px; padding: 0 46px 0 46px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 1rem; transition: border-color .2s, box-shadow .2s; }
.search input::placeholder { color: var(--placeholder); }
.search input:focus { outline: none; border-color: var(--sage-deep); box-shadow: 0 0 0 4px rgba(77,107,80,.12); }
.search .clear-search { position: absolute; right: 5px; width: 40px; height: 40px; border-radius: 999px; border: 0; background: transparent; font-size: 1.3rem; color: var(--text-soft); }
.search .clear-search[hidden] { display: none; }

.field { display: grid; gap: 6px; margin-bottom: 18px; }
.field label, .field .label { font-weight: 600; font-size: .95rem; }
.field small { color: var(--text-soft); font-weight: 400; }
.input, .select, .textarea { width: 100%; min-height: 46px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); padding: 10px 14px; }
.textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.textarea.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .88rem; min-height: 260px; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--sage-deep); box-shadow: 0 0 0 4px rgba(77,107,80,.12); }

/* ---------- home ---------- */
.hero { padding: 24px 0 8px; }
.hero .container { display: grid; gap: 28px; align-items: center; }
@media (min-width: 860px) { .hero { padding: 64px 0 32px; } .hero .container { grid-template-columns: 1fr 1fr; gap: 64px; } }
.hero h1 { max-width: 14ch; }
.hero p.lead { font-size: 1.1rem; color: var(--text-soft); max-width: 38ch; }
.hero .search { margin: 24px 0 14px; max-width: 460px; }
.hero-photo { position: relative; display: block; border-radius: 28px; overflow: hidden; background: var(--muted-bg); aspect-ratio: 1; text-decoration: none; color: var(--text); }
.hero-photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
.hero-photo:hover img { transform: scale(1.03); }
.hero-photo .caption { position: absolute; left: 14px; bottom: 14px; background: var(--glass-strong); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: .9rem; display: flex; gap: 8px; align-items: center; }
.hero-photo .caption small { color: var(--text-soft); font-weight: 500; }

.section { padding: 32px 0; }
@media (min-width: 860px) { .section { padding: 48px 0; } }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.section-head h2 { margin: 0; }
.cat-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.cat-row::-webkit-scrollbar { display: none; }
@media (min-width: 860px) { .cat-row { flex-wrap: wrap; } }
.cat-row .chip { min-height: 44px; padding: 0 18px; font-size: .95rem; }
.cat-row .chip span { color: var(--text-soft); }

/* ---------- toy cards ---------- */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; position: relative; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 20px; } }
@media (min-width: 1100px) { .grid.wide { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card { position: relative; }
.card-link { display: block; color: inherit; text-decoration: none; }
.card-link:focus-visible { outline-offset: 4px; border-radius: var(--radius); }
.card-img { aspect-ratio: 1; overflow: hidden; background: var(--muted-bg); border-radius: var(--radius); transition: box-shadow .35s var(--ease), transform .35s var(--ease); }
.card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }
@media (hover: hover) { .card:hover .card-img { transform: translateY(-4px); box-shadow: var(--shadow-lift); } .card:hover .card-img img { transform: scale(1.04); } }
.card-body { padding: 12px 2px 0; }
.card-body h3 { font-size: 1rem; margin: 0 0 2px; font-weight: 700; }
.card-meta { font-size: .86rem; color: var(--text-soft); margin: 0; }
.new-dot { display: inline-block; font-size: .72rem; font-weight: 700; color: var(--terra-deep); margin-left: 6px; vertical-align: 2px; letter-spacing: .04em; text-transform: uppercase; }

.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot-c { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(63,46,36,.18); display: inline-block; flex: none; }

/* heart */
.heart { position: absolute; top: 10px; right: 10px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--glass-strong); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: transform .2s var(--ease), background .2s; }
.heart::before { content: ""; position: absolute; inset: -4px; }
.heart svg { width: 20px; height: 20px; overflow: visible; }
.heart svg path { fill: transparent; stroke: var(--pink-deep); stroke-width: 2; transition: fill .2s; }
.heart[aria-pressed="true"] svg path { fill: var(--pink); stroke: var(--pink-deep); }
.heart:hover { background: var(--surface); }
.heart.pop svg { animation: pop .45s var(--ease); }
.heart.pop::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--pink); animation: ring .5s ease-out forwards; }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.35); } 60% { transform: scale(.9); } 100% { transform: scale(1); } }
@keyframes ring { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
.heart.inline { position: static; background: var(--surface); border: 1px solid var(--line); width: 48px; height: 48px; backdrop-filter: none; }
.heart.inline::before { display: none; }

.reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
.reveal.in { opacity: 1; transform: none; }
.no-js .reveal { opacity: 1; transform: none; }

/* ---------- browse ---------- */
.page-head { padding: 28px 0 4px; }
.page-head h1 { margin-bottom: 4px; }
.page-head p { color: var(--text-soft); margin: 0; }
.browse-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; padding: 8px 0 48px; }
.browse-layout > * { min-width: 0; }
@media (min-width: 960px) { .browse-layout { grid-template-columns: 220px minmax(0, 1fr); gap: 48px; } }

.filterbar { position: sticky; top: var(--header-h); z-index: 30; background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 12px 0 10px; margin: 0 -2px 4px; }
.filterbar-row { display: flex; gap: 8px; align-items: center; }
.filterbar .search { flex: 1; }
.filter-toggle { flex: none; padding: 0 16px; }
@media (min-width: 960px) { .filter-toggle { display: none !important; } }
.active-row { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding: 10px 2px 0; scrollbar-width: none; }
.active-row::-webkit-scrollbar { display: none; }
.active-row:empty { display: none; }
.active-row .chip { min-height: 34px; padding: 0 12px; font-size: .84rem; background: var(--muted-bg); border-color: transparent; }

.results-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 4px 0 16px; color: var(--text-soft); font-size: .92rem; }
.results-line select { min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: .9rem; color: var(--text); }

.filters { display: none; }
@media (min-width: 960px) { .filters { display: block; position: sticky; top: calc(var(--header-h) + 20px); max-height: calc(100vh - var(--header-h) - 40px); overflow: auto; padding-right: 4px; } }
.filters-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.filters-head h2 { font-size: 1rem; margin: 0; }
.fgroup { padding: 14px 0; border-top: 1px solid var(--line); }
.fgroup h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--text-soft); font-family: var(--font-body); font-weight: 600; margin-bottom: 10px; }
.fgroup .chip { min-height: 36px; padding: 0 12px; font-size: .86rem; }
.fgroup .chip .n { display: none; }

.sheet-backdrop { position: fixed; inset: 0; background: rgba(40, 28, 20, .3); z-index: 60; opacity: 0; transition: opacity .3s; }
.sheet-backdrop.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-height: 86vh; overflow: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px 20px 0; transform: translateY(100%); transition: transform .38s var(--ease); }
.sheet.open { transform: none; }
.sheet .grab { width: 36px; height: 4px; border-radius: 9px; background: var(--line); margin: 4px auto 10px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.sheet-head h2 { margin: 0; font-size: 1.2rem; }
.sheet-foot { position: sticky; bottom: 0; background: var(--surface); padding: 12px 0 calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 10px; border-top: 1px solid var(--line); margin-top: 8px; }
.sheet-foot .btn { flex: 1; }

.empty { text-align: center; padding: 56px 20px; }
.empty svg { width: 64px; height: 64px; margin: 0 auto 14px; color: var(--hover-line); }
.empty h3 { font-size: 1.2rem; }
.empty p { color: var(--text-soft); max-width: 34ch; margin: 0 auto 20px; }

/* ---------- pattern page ---------- */
.crumbs { padding: 12px 0 0; }
.crumbs a { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; text-decoration: none; min-height: 44px; color: var(--text-soft); font-size: .92rem; }
.crumbs a:hover { color: var(--text); }
.crumbs svg { width: 18px; height: 18px; }
.toy-top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 4px 0 24px; }
.toy-top > * { min-width: 0; }
@media (min-width: 900px) { .toy-top { grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 56px; align-items: start; } .toy-top .gallery { position: sticky; top: calc(var(--header-h) + 16px); } }

.gallery { position: relative; }
.g-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 22px; scrollbar-width: none; background: var(--muted-bg); }
.g-track::-webkit-scrollbar { display: none; }
.g-slide { flex: 0 0 100%; scroll-snap-align: center; aspect-ratio: 1; border: 0; padding: 0; background: none; cursor: zoom-in; }
.g-slide img { width: 100%; height: 100%; object-fit: cover; }
.g-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--glass-strong); color: var(--text); display: none; place-items: center; opacity: 0; transition: opacity .2s; }
.gallery:hover .g-nav { opacity: 1; }
.g-nav svg { width: 20px; height: 20px; }
.g-nav.prev { left: 12px; } .g-nav.next { right: 12px; }
@media (hover: hover) { .g-nav { display: grid; } }
.g-dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
.g-dots button { width: 7px; height: 7px; padding: 0; border-radius: 99px; border: 0; background: var(--hover-line); transition: width .3s var(--ease), background .3s; position: relative; }
.g-dots button::before { content: ""; position: absolute; inset: -14px -6px; }
.g-dots button[aria-current="true"] { width: 20px; background: var(--text); }
.g-thumbs { display: none; gap: 10px; margin-top: 12px; }
@media (min-width: 900px) { .g-thumbs { display: flex; } .g-dots { display: none; } }
.g-thumbs button { width: 68px; height: 68px; padding: 0; border-radius: 12px; overflow: hidden; border: 2px solid transparent; background: var(--muted-bg); opacity: .7; transition: opacity .2s, border-color .2s; }
.g-thumbs button[aria-current="true"] { border-color: var(--text); opacity: 1; }
.g-thumbs img { width: 100%; height: 100%; object-fit: cover; }

.toy-intro .kicker { font-size: .88rem; color: var(--text-soft); margin-bottom: 6px; }
.toy-intro h1 { margin-bottom: 12px; }
.toy-intro .lede { font-size: 1.05rem; color: var(--text-soft); max-width: 46ch; }
.toy-actions { display: flex; gap: 10px; margin: 20px 0 28px; }
.toy-actions .btn-primary { flex: 1; max-width: 260px; }

.facts { border-top: 1px solid var(--line); }
.facts dl { display: grid; grid-template-columns: 1fr 1fr; margin: 0; }
.facts dl > div { padding: 14px 0; border-bottom: 1px solid var(--line); }
.facts dl > div:nth-child(odd):not(.full) { padding-right: 12px; }
.facts dt { font-size: .8rem; color: var(--text-soft); }
.facts dd { margin: 2px 0 0; font-weight: 600; }
.facts .full { grid-column: 1 / -1; }
.color-list { display: flex; flex-wrap: wrap; gap: 6px 16px; font-weight: 500; font-size: .92rem; margin-top: 4px; }
.color-list span { display: inline-flex; align-items: center; gap: 7px; }
.tag-line { margin-top: 14px; font-size: .88rem; color: var(--text-soft); }
.tag-line a { color: var(--text-soft); text-decoration: none; }
.tag-line a:hover { color: var(--text); text-decoration: underline; }

.pattern-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; padding: 8px 0 40px; }
.pattern-body > * { min-width: 0; }
@media (min-width: 1000px) { .pattern-body { grid-template-columns: minmax(0, 1fr) 240px; gap: 56px; } .pattern-side { position: sticky; top: calc(var(--header-h) + 20px); } }
@media (max-width: 999px) { .pattern-side { display: none; } }

.tracker { position: sticky; top: var(--header-h); z-index: 20; background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 12px 0; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.tracker-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .9rem; }
.tracker-top strong { font-weight: 600; }
.pbar { height: 6px; border-radius: 99px; background: var(--muted-bg); overflow: hidden; margin-top: 8px; }
.pbar i { display: block; height: 100%; width: 0; background: var(--sage-deep); border-radius: 99px; transition: width .5s var(--ease); }
.tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 10px 0 2px; font-size: .9rem; }
.tools .muted { font-size: .85rem; }

.switch { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; background: none; border: 0; padding: 4px 0; min-height: 44px; font-size: .92rem; }
.switch .track { width: 40px; height: 24px; border-radius: 99px; background: var(--track); position: relative; transition: background .25s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .25s var(--ease); }
.switch[aria-checked="true"] .track { background: var(--sage-deep); }
.switch[aria-checked="true"] .track::after { transform: translateX(16px); }
.wake-tip { font-size: .85rem; color: var(--text-soft); margin: 0; }
.wake-tip:empty { display: none; }

.text-size { display: inline-flex; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 2px; }
.text-size button { min-width: 40px; min-height: 36px; border: 0; background: none; border-radius: 999px; font-weight: 600; font-size: .85rem; color: var(--text-soft); }
.text-size button[aria-pressed="true"] { background: var(--text); color: var(--on-ink); }

.sec { padding: 28px 0 0; }
.sec > h2 { font-size: 1.3rem; margin-bottom: 14px; }
.sec-note { color: var(--text-soft); margin-top: -8px; font-size: .92rem; }

.checklist { list-style: none; margin: 0; padding: 0; }
.check { display: flex; gap: 14px; align-items: flex-start; padding: 11px 4px; cursor: pointer; min-height: 48px; border-radius: 10px; }
.check input { position: absolute; opacity: 0; pointer-events: none; }
.check .box { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--box-border); background: var(--surface); display: grid; place-items: center; transition: background .2s, border-color .2s, transform .15s; margin-top: 1px; }
.check .box svg { width: 15px; height: 15px; color: var(--on-primary); stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s var(--ease) .05s; }
.check input:checked + .box { background: var(--sage-deep); border-color: var(--sage-deep); }
.check input:checked + .box svg { stroke-dashoffset: 0; }
.check input:focus-visible + .box { outline: 2.5px solid var(--sage-deep); outline-offset: 2px; }
.check:active .box { transform: scale(.9); }
.check .txt { flex: 1; transition: color .2s; }
.check input:checked ~ .txt { color: var(--text-soft); }
.checklist li + li .check { border-top: 1px solid var(--line); border-radius: 0; }

/* rounds */
.rounds { list-style: none; margin: 0; padding: 0; }
.round .check { font-size: var(--round-size); line-height: 1.45; padding: 13px 8px; gap: 12px; border-radius: 10px; transition: background .2s; }
.round .check:hover { background: var(--muted-bg); }
.round .rlabel { flex: none; min-width: 2.4em; font-weight: 600; color: var(--text-soft); font-variant-numeric: tabular-nums; }
.round .rcount { flex: none; color: var(--text-soft); font-size: .85em; font-variant-numeric: tabular-nums; align-self: center; }
.round input:checked ~ .txt { text-decoration: line-through; text-decoration-color: rgba(117,101,90,.5); }
.round input:checked ~ .rlabel, .round input:checked ~ .rcount { opacity: .5; }
.round.next .check { background: var(--sage-tint); }
.round.next .rlabel { color: var(--sage-deep); }
.pnote { margin: 6px 8px 8px; padding-left: 12px; border-left: 2px solid var(--line); color: var(--text-soft); font-size: .95rem; }

/* collapsibles */
.fold { border-top: 1px solid var(--line); }
.fold:last-child { border-bottom: 1px solid var(--line); }
.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 16px 4px; min-height: 60px; font-family: var(--font-head); font-weight: 800; font-size: 1.12rem; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary .s-title { flex: 1; }
.fold > summary .s-title small { font-family: var(--font-body); font-weight: 500; font-size: .82rem; color: var(--text-soft); margin-left: 6px; }
.fold > summary .s-meta { font-family: var(--font-body); font-size: .85rem; font-weight: 500; color: var(--text-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.fold > summary .s-meta.done { color: var(--sage-deep); font-weight: 600; }
.fold > summary .chev { width: 28px; height: 28px; display: grid; place-items: center; transition: transform .35s var(--ease); flex: none; color: var(--text-soft); }
.fold > summary .chev svg { width: 18px; height: 18px; }
.fold[open] > summary .chev { transform: rotate(180deg); }
.fold-body { overflow: hidden; }
.fold-inner { padding: 0 0 18px; }
.mini-bar { display: none; }

.abbr-table { width: 100%; border-collapse: collapse; font-size: .95rem; }
.abbr-table th { text-align: left; width: 76px; font-weight: 600; padding: 8px 4px; vertical-align: top; }
.abbr-table td { padding: 8px 4px; color: var(--text-soft); }

.mindmap { width: 100%; height: auto; display: block; }
.mindmap-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; }

.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.steps li { counter-increment: s; display: flex; gap: 14px; align-items: flex-start; }
.steps li::before { content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--muted-bg); display: grid; place-items: center; font-weight: 700; font-size: .85rem; margin-top: 1px; }

.tricky { display: grid; gap: 18px; }
.tip h3 { font-size: 1rem; margin-bottom: 4px; }
.tip p { margin: 0; color: var(--text-soft); }

.side-card h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--text-soft); font-family: var(--font-body); font-weight: 600; }
.part-jump { list-style: none; margin: 0; padding: 0; }
.part-jump a { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; text-decoration: none; color: var(--text); font-weight: 500; font-size: .95rem; border-bottom: 1px solid var(--line); }
.part-jump a:hover { color: var(--sage-deep); }
.part-jump small { color: var(--text-soft); font-variant-numeric: tabular-nums; }
.part-jump .ok { color: var(--sage-deep); font-weight: 600; }

.related { border-top: 1px solid var(--line); }

/* lightbox */
.lightbox { position: fixed; inset: 0; z-index: 90; background: rgba(28, 20, 15, .94); display: none; flex-direction: column; }
.lightbox.open { display: flex; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; } }
.lb-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; color: #FAF8F5; padding-top: calc(12px + env(safe-area-inset-top)); font-size: .9rem; }
.lb-bar button, .lb-nav { width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center; }
.lb-bar svg, .lb-nav svg { width: 22px; height: 22px; }
.lb-stage { flex: 1; overflow: auto; display: grid; place-items: center; touch-action: pan-x pan-y pinch-zoom; }
.lb-stage img { max-width: min(92vw, 900px); max-height: 78vh; border-radius: 14px; cursor: zoom-in; }
.lb-stage.zoomed { place-items: start; }
.lb-stage.zoomed img { max-height: none; width: 200vw; max-width: 1800px; cursor: zoom-out; border-radius: 0; }
.lb-foot { display: flex; justify-content: center; gap: 20px; align-items: center; color: rgba(255,255,255,.7); padding: 12px 0 calc(16px + env(safe-area-inset-bottom)); font-size: .85rem; }

/* back to top & toast */
.to-top { position: fixed; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 44; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--text); display: grid; place-items: center; box-shadow: var(--shadow); opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .3s, transform .3s var(--ease); }
.to-top svg { width: 20px; height: 20px; }
.to-top.show { opacity: 1; transform: none; pointer-events: auto; }
@media (min-width: 860px) { .to-top { bottom: 24px; right: 24px; } }
.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 95; transform: translate(-50%, 16px); background: var(--text); color: var(--on-ink); padding: 11px 18px; border-radius: 12px; font-weight: 500; font-size: .92rem; max-width: min(92vw, 420px); text-align: center; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s var(--ease); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 860px) { .toast { bottom: 28px; } }

/* footer */
.site-footer { margin-top: 24px; padding: 28px 0 32px; border-top: 1px solid var(--line); color: var(--text-soft); font-size: .88rem; }
.site-footer .container { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; align-items: center; }
.site-footer a { color: var(--text-soft); }

/* about */
.about { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; padding: 28px 0 48px; }
@media (min-width: 860px) { .about { grid-template-columns: 340px minmax(0, 1fr); gap: 56px; align-items: start; } }
.about-photo { border-radius: 24px; overflow: hidden; background: var(--muted-bg); aspect-ratio: 1; }
.about-photo img { width: 100%; height: 100%; object-fit: cover; }
.about ul { padding-left: 20px; }
.about li { margin-bottom: 6px; }
.placeholder-note { display: inline-block; background: #FFF4D6; color: #6B4E12; border-radius: 6px; padding: 1px 8px; font-size: .78rem; font-weight: 600; }

/* admin */
.admin { padding: 8px 0 50px; }
.admin-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; }
@media (min-width: 1000px) { .admin-grid { grid-template-columns: 280px minmax(0, 1fr); align-items: start; } }
.admin-list { list-style: none; margin: 0; padding: 0; }
.admin-list li { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.admin-list img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex: none; background: var(--muted-bg); }
.admin-list .nm { flex: 1; font-weight: 600; line-height: 1.25; min-width: 0; font-size: .95rem; }
.admin-list .nm small { display: block; font-weight: 400; color: var(--text-soft); font-size: .8rem; }
.form-card { background: var(--surface); border-radius: var(--radius); padding: 24px; border: 1px solid var(--line); }
.form-card fieldset { border: 0; padding: 0 0 6px; margin: 0 0 22px; border-bottom: 1px solid var(--line); }
.form-card legend { font-family: var(--font-head); font-weight: 800; font-size: 1.1rem; margin-bottom: 14px; padding: 0; }
.two { display: grid; gap: 0 16px; }
@media (min-width: 640px) { .two { grid-template-columns: 1fr 1fr; } }
.toggle-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle-chips label { position: relative; }
.toggle-chips input { position: absolute; opacity: 0; }
.toggle-chips span { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; font-size: .9rem; cursor: pointer; transition: all .2s; }
.toggle-chips input:checked + span { background: var(--text); color: var(--on-ink); border-color: var(--text); }
.toggle-chips input:focus-visible + span { outline: 2.5px solid var(--sage-deep); outline-offset: 2px; }
.photo-drop { border: 1.5px dashed var(--box-border); border-radius: var(--radius); padding: 22px; text-align: center; background: var(--bg); cursor: pointer; display: block; font-size: .95rem; }
.photo-drop.drag { background: var(--sage-tint); border-color: var(--sage-deep); }
.photo-drop svg { width: 28px; height: 28px; margin: 0 auto 6px; color: var(--text-soft); }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; margin-top: 12px; }
.photo-grid figure { margin: 0; position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1; background: var(--muted-bg); }
.photo-grid img { width: 100%; height: 100%; object-fit: cover; }
.photo-grid .ph-actions { position: absolute; inset: auto 4px 4px 4px; display: flex; gap: 4px; justify-content: space-between; }
.photo-grid .ph-actions button { min-width: 30px; height: 30px; border-radius: 99px; border: 0; background: var(--glass-strong); color: var(--text); font-size: .72rem; font-weight: 600; padding: 0 8px; }
.photo-grid .cover-flag { position: absolute; top: 4px; left: 4px; background: var(--text); color: var(--on-ink); font-size: .68rem; font-weight: 600; border-radius: 99px; padding: 1px 8px; }
.color-rows { display: grid; gap: 8px; margin-bottom: 8px; }
.color-rows .crow { display: flex; gap: 8px; align-items: center; }
.color-rows input[type=color] { width: 48px; height: 46px; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface); flex: none; }
.color-rows .input { flex: 1; }
.parse-preview { background: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: .88rem; margin-top: 8px; color: var(--text-soft); }
.parse-preview strong { color: var(--text); }
.parse-preview ul { margin: 6px 0 0; padding-left: 20px; }
.form-actions { display: flex; flex-wrap: wrap; gap: 10px; position: sticky; bottom: calc(72px + env(safe-area-inset-bottom)); background: var(--surface); padding: 12px 0 2px; }
@media (min-width: 860px) { .form-actions { bottom: 0; } }
.gate { max-width: 400px; margin: 48px auto; text-align: center; }
.help-box { background: var(--bg); border-radius: 10px; padding: 12px 14px; font-size: .88rem; color: var(--text-soft); }
.help-box code { background: var(--muted-bg); color: var(--text); padding: 1px 5px; border-radius: 5px; font-size: .85em; }


/* ---------- dark mode: same cozy palette, warm espresso browns ---------- */
:root[data-theme="dark"] {
  /* slate night: deep blue-grey, cream text, peach and copper accents */
  --bg: #141B23;
  --surface: #1D2831;
  --muted-bg: #24323B;
  --line: #364049;
  --text: #F4EDE3;
  --text-soft: #AEB5B9;
  --sage: #8FA6B2;
  --sage-deep: #D9AC96;   /* peach: primary buttons, checks, highlights */
  --sage-tint: #2A3540;
  --terra: #B98A70;       /* copper */
  --terra-deep: #D9AC96;  /* peach links */
  --pink: #D98E9A;
  --pink-deep: #E7A3AF;
  --on-primary: #141B23;
  --primary-hover: #E6BDA9;
  --on-ink: #141B23;
  --on-pink: #141B23;
  --glass: rgba(24, 34, 43, .9);
  --glass-2: rgba(24, 34, 43, .96);
  --glass-strong: rgba(29, 40, 49, .9);
  --hover-line: #4D5B64;
  --soft-hover: #2B3942;
  --box-border: #6B7A85;
  --placeholder: #8A949B;
  --track: #3A4852;
  --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 24px rgba(0, 0, 0, .35);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, .3), 0 16px 36px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
[data-theme="dark"] .card-img img, [data-theme="dark"] .g-slide img, [data-theme="dark"] .hero-photo img, [data-theme="dark"] .about-photo img { filter: brightness(.9) saturate(.95); }
[data-theme="dark"] .placeholder-note { background: #2B3942; color: #F2E2C9; }
[data-theme="dark"] .nav a[aria-current="page"] { background: #2B3942; }
[data-theme="dark"] .site-footer { background: #0F161E; }
html { transition: background-color .3s; }
body { transition: background-color .3s, color .3s; }

.theme-toggle { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--text-soft); display: grid; place-items: center; margin-left: 4px; }
.theme-toggle:hover { background: var(--muted-bg); color: var(--text); }
.theme-toggle svg { width: 20px; height: 20px; }
.theme-toggle .sun { display: none; }
[data-theme="dark"] .theme-toggle .sun { display: block; }
[data-theme="dark"] .theme-toggle .moon { display: none; }
.header-right { display: flex; align-items: center; }

/* view transitions */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .25s; animation-timing-function: var(--ease); }
::view-transition-group(toy-hero) { animation-duration: .45s; animation-timing-function: var(--ease); }
::view-transition-image-pair(toy-hero) { border-radius: 18px; overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  .reveal { opacity: 1; transform: none; }
}

@media print {
  body { background: #fff; padding: 0; font-size: 11pt; color: #2b1d16; }
  .site-header, .tabbar, .site-footer, .to-top, .toast, .toy-actions, .crumbs, .g-nav, .g-dots, .g-thumbs, .heart, .tools, .related, .pattern-side, .no-print, .lightbox, .tag-line { display: none !important; }
  .tracker { position: static; border: 0; }
  .toy-top { grid-template-columns: 180px 1fr !important; gap: 24px !important; }
  .g-slide:not(:first-child) { display: none; }
  .pattern-body { grid-template-columns: 1fr !important; }
  .fold-body { height: auto !important; display: block !important; }
  .fold > summary .chev { display: none; }
  .round .check { padding: 3px 4px; font-size: 11pt; }
  .round.next .check { background: none; }
  .check .box { width: 14px; height: 14px; border-width: 1px; }
  .reveal { opacity: 1 !important; transform: none !important; }
  a { color: inherit; text-decoration: none; }
}

/* make it your size */
.sizer { margin-top: 24px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.sizer-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sizer-head h2 { font-size: 1.1rem; margin: 0; }
.sizer-head .btn-link { min-height: 36px; padding: 4px; }
.sizer-head .btn-link[hidden] { display: none; }
.sizer-label { font-size: .8rem; color: var(--text-soft); margin: 14px 0 8px; }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.opts.hooks { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.opt strong { white-space: nowrap; }
.opt { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 9px 12px; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; transition: border-color .2s, background .2s, color .2s; }
.opt:hover { border-color: var(--hover-line); }
.opt strong { font-weight: 600; font-size: .95rem; font-variant-numeric: tabular-nums; }
.opt span { font-size: .78rem; color: var(--text-soft); line-height: 1.3; }
.opt[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--on-ink); }
.opt[aria-pressed="true"] span { color: inherit; opacity: .75; }
.sizer-note { margin: 14px 0 0; font-size: .88rem; color: var(--text-soft); }
.sizer-note strong { color: var(--text); }
@media print { .sizer .opts, .sizer-label, .sizer-head .btn-link { display: none !important; } .sizer { border: 0; padding: 0; } }

/* credit line & notices on pattern pages */
.credit { font-size: .88rem; color: var(--text-soft); font-style: italic; margin: -4px 0 12px; }
.notice { display: flex; gap: 10px; align-items: flex-start; background: var(--muted-bg); border-radius: 12px; padding: 10px 14px; font-size: .9rem; margin: 0 0 4px; }
.notice svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--terra-deep); }
.g-slide { position: relative; }
.g-cap { position: absolute; left: 10px; right: 10px; bottom: 10px; background: var(--glass-strong); color: var(--text); font-size: .75rem; line-height: 1.35; padding: 6px 10px; border-radius: 10px; text-align: left; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

</style>

    pattern: `## Back
Charcoal heather.
Row 1: ch 78 (86, 96), hdc in 3rd ch from hook and in each ch across (76, 84, 94)
Row 2-15: ch 1, turn, hdc3 across (76, 84, 94)
Armhole shaping starts here.
Row 16: turn, sl st in first 3 sts, ch 1, hdc3 in next st and in each st across to last 3 sts, leave the last 3 sts unworked (70, 78, 88)
Row 17: ch 1, turn, hdc2tog, hdc3 across to last 2 sts, hdc2tog (68, 76, 86)
Row 18: ch 1, turn, hdc2tog, hdc3 across to last 2 sts, hdc2tog (66, 74, 84)
Row 19-44: ch 1, turn, hdc3 across (66, 74, 84)
Fasten off. Place markers 19 (22, 26) sts in from each end of Row 44. These outer sts are the shoulders, and the 28 (30, 32) sts in the middle are the back neck.
## Right front
Charcoal heather.
This is the under panel. Row 1 ends at the front edge, so the odd rows end at the front edge and the even rows begin at it.
Row 1: ch 69 (72, 76), hdc in 3rd ch from hook and in each ch across (67, 70, 74)
Row 2: ch 1, turn, hdc2tog, hdc3 across (66, 69, 73)
Row 3: ch 1, turn, hdc3 across to last 2 sts, hdc2tog (65, 68, 72)
Row 4-15: repeat Row 2 and Row 3 in turn, 6 times each (53, 56, 60)
Armhole shaping starts here, at the side edge.
Row 16: ch 1, turn, hdc2tog, hdc3 across to last 3 sts, leave the last 3 sts unworked (49, 52, 56)
Row 17: ch 1, turn, hdc2tog, hdc3 across to last 2 sts, hdc2tog (47, 50, 54)
Row 18: ch 1, turn, hdc2tog, hdc3 across to last 2 sts, hdc2tog (45, 48, 52)
Row 19-44: repeat Row 3 and Row 2 in turn, 13 times each (19, 22, 26)
Fasten off. The last row is the shoulder.
## Left front
Charcoal heather.
This is the over panel. Row 1 ends at the side edge, so the odd rows begin at the front edge and the even rows end at it.
Row 1: ch 69 (72, 76), hdc in 3rd ch from hook and in each ch across (67, 70, 74)
Row 2: ch 1, turn, hdc3 across to last 2 sts, hdc2tog (66, 69, 73)
Row 3: ch 1, turn, hdc2tog, hdc3 across (65, 68, 72)
Row 4-15: repeat Row 2 and Row 3 in turn, 6 times each (53, 56, 60)
Armhole shaping starts here, at the side edge.
Row 16: turn, sl st in first 3 sts, ch 1, hdc3 in next st and in each st across to last 2 sts, hdc2tog (49, 52, 56)
Row 17: ch 1, turn, hdc2tog, hdc3 across to last 2 sts, hdc2tog (47, 50, 54)
Row 18: ch 1, turn, hdc2tog, hdc3 across to last 2 sts, hdc2tog (45, 48, 52)
Row 19-44: repeat Row 3 and Row 2 in turn, 13 times each (19, 22, 26)
Fasten off. The last row is the shoulder.
## Hem band (make 2)
Charcoal heather.
One band goes on the back hem. The other goes on the Right Front hem and reaches across to the left side seam.
Row 1: ch 13, sc in 2nd ch from hook, dc in next ch, [sc, dc] x5 (12)
Row 2-76 (2-84, 2-94): ch 1, turn, [sc, dc] x6 (12)
Fasten off, leaving a long tail for sewing.
## Waist strap
Charcoal heather.
This strap is sewn to the Left Front hem, then wraps around the right side and buttons at the back. Start at the buttonhole end.
Row 1: ch 13, sc in 2nd ch from hook, dc in next ch, [sc, dc] x5 (12)
Row 2-3: ch 1, turn, [sc, dc] x6 (12)
Row 4: ch 1, turn, sc, dc, ch 2, sk 2 sts, [sc, dc] x2, ch 2, sk 2 sts, sc, dc (12)
Row 5: ch 1, turn, [sc, dc] x6, working 1 st in each st and in each ch (12)
Row 6-124 (6-136, 6-150): ch 1, turn, [sc, dc] x6 (12)
Fasten off, leaving a long tail for sewing.
## Front band and collar
Charcoal heather.
Row 1: ch 11, sc in 2nd ch from hook, dc in next ch, [sc, dc] x4 (10)
Row 2-168 (2-170, 2-172): ch 1, turn, [sc, dc] x5 (10)
Fasten off, leaving a long tail for sewing. Place a marker on Row 84 (85, 86). This is the center back of the collar.
## Armhole edging (make 2)
Charcoal heather.
Work these after the vest is sewn together. Join the yarn at the underarm side seam.
R1: ch 1, sc evenly around the armhole, 45 sts along each piece (3 sc along the 3 skipped sts, 1 sc in each row end of Rows 16-18, then 3 sc in every 2 row ends up to the shoulder), sl st to first sc (90)
R2: ch 1, [sc, dc] x45, sl st to first sc (90)
R3: ch 1, [dc, sc] x45, sl st to first dc (90)
R4: ch 1, [sc, dc] x45, sl st to first sc (90)
Fasten off and weave in the ends.`,
    assembly: [
      'Weave in all ends except the sewing tails. Pin each piece to its measurements, mist with water and let it dry. The back should measure 42 (47, 52) cm wide and 31 cm tall.',
      'Sew the shoulders: lay the last row of each front on the matching shoulder sts of the back (19 (22, 26) sts) and whipstitch. Leave the middle 28 (30, 32) back sts open as the back neck.',
      'Sew one Hem band along the foundation edge of the back, 1 band row to 1 back st, so the band runs from side edge to side edge.',
      'Sew the second Hem band along the foundation edge of the Right Front, starting at the side edge, 1 band row to 1 st. The last 9 (14, 20) band rows extend past the front tip.',
      'Sew the last 67 (70, 74) rows of the Waist strap along the foundation edge of the Left Front, 1 strap row to 1 st. The non-buttonhole end of the strap should line up with the side edge, and the buttonhole end stays free past the front tip.',
      'Sew the right side seam: the back and its hem band to the Right Front and its hem band.',
      'Lay the Right Front flat, then cross the Left Front over it. Bring the free end of the Right Front hem band across to the left side, under the Left Front. Sew the left side seam through all layers: the back and its hem band, the Left Front and the strap end, and the end of the Right Front hem band tucked between them.',
      'Pin the Front band and collar along the neckline. Match its center marker to the center of the back neck, then pin evenly down the diagonal edge of each front to the top of the hem band or strap. Sew in place along one long edge, then tack each short end to the top of the band below it.',
      'Work the Armhole edging around each armhole.',
      'Try the vest on and wrap the strap around your right side and across your back. Mark the buttonhole positions on the back hem band, about 3.5 cm to the left of center (as worn), and sew on the 2 buttons.',
      'Weave in all remaining ends and lightly steam the seams flat.',
    ],
    tricky: [
      { q: 'Check your gauge first', a: 'Crochet a swatch before you start: 18 hdc3 × 14 rows should measure 10 cm. If you have more stitches than the gauge, go up a hook size; if you have fewer, go down.' },
      { q: 'Finding the 3rd loop', a: 'Turn your work so you can see the back of the row. Below the top V of each hdc there is a horizontal bar, and that bar is the 3rd loop. Working into it pushes the V forward and gives the knit-look ridges. Always work into the same side so every row looks alike.' },
      { q: 'Hdc2tog in the 3rd loop', a: 'Yarn over, insert the hook in the 3rd loop of the next st and pull up a loop. Yarn over, insert in the 3rd loop of the following st and pull up a loop. Yarn over and pull through all 5 loops. Count your sts after each decrease row.' },
      { q: 'Keeping the diagonal on the right edge', a: 'Put a marker on the front edge after Row 1 and move it up every few rows. Every row has one decrease at the marked edge. If a row\'s decrease lands at the side edge instead, rip back that row.' },
      { q: 'Left and Right Fronts are mirror images', a: 'They are written separately on purpose. Do not make two of the same front, or the ridged side will face inward on one of them. Hold the finished fronts side by side before sewing: the diagonals should slant toward each other.' },
      { q: 'Griddle stitch rhythm', a: 'The bands alternate sc and dc. Because each row has an even number of sts, every sc lands on a dc and every dc lands on an sc without any extra counting, which builds the seed-stitch bumps. If two sc end up stacked, you missed a st.' },
      { q: 'Sewing the band to the diagonal', a: 'The diagonal edge is a mix of row ends and decreases, so it stretches. Pin the band at the center back, both shoulders and both lower ends first, then fill in the pins evenly between them before sewing. The band should lie flat without rippling.' },
      { q: 'Making the collar stand up', a: 'Sew the band with small, firm stitches along the back neck and do not stretch it there. The extra band length at the back neck makes it rise into a little stand collar.' },
      { q: 'Making it longer', a: 'Add rows to Rows 2–15 of the back and both fronts, and add the same number of rows to the Front band and collar for every 2 rows you add.' },
      { q: 'Choosing yarn', a: 'Choose a soft yarn with a little halo, such as wool-alpaca, to get the same heathered look.' },
    ],
  },

    pattern: `## Head
Pink.
R1: 6 sc in MR (6)
R2: inc around (12)
R3: [sc, inc] x6 (18)
R4: [sc 2, inc] x6 (24)
R5: [sc 3, inc] x6 (30)
R6: [sc 4, inc] x6 (36)
R7-13: sc around (36)
R14: [sc 4, dec] x6 (30)
R15: [sc 3, dec] x6 (24)
R16: [sc 2, dec] x6 (18)
Start stuffing firmly.
R17: [sc, dec] x6 (12)
R18: dec x6 (6)
Close the hole and leave a tail to sew.
## Snout
Pink.
R1: 6 sc in MR (6)
R2: [sc, inc] x3 (9)
R3: [sc 2, inc] x3 (12)
R4: [sc 3, inc] x3 (15)
R5-6: sc around (15)
Fasten off with a long tail. Sew to the lower front of the head between R9 and R15, stuffing as you go.
Eyes: with yellow, embroider slanted almond eyes just above the snout sides, 6-7 stitches apart. Add 2 small pink stitches for nostrils.
## Horn (make 2)
Cream.
R1: 4 sc in MR (4)
R2: [sc, inc] x2 (6)
R3: [sc 2, inc] x2 (8)
R4: sc around (8)
Fasten off. Do not stuff, or stuff lightly. Sew on top of the head at R5-7, angled slightly back.
## Body and neck
Pink. Start at the bottom.
R1: 6 sc in MR (6)
R2: inc around (12)
R3: [sc, inc] x6 (18)
R4: [sc 2, inc] x6 (24)
R5: [sc 3, inc] x6 (30)
R6: [sc 4, inc] x6 (36)
R7: [sc 5, inc] x6 (42)
R8-15: sc around (42)
R16: [sc 5, dec] x6 (36)
R17-19: sc around (36)
R20: [sc 4, dec] x6 (30)
R21-22: sc around (30)
R23: [sc 3, dec] x6 (24)
R24-25: sc around (24)
Stuff the body firmly and keep the bottom flat so it sits.
R26: [sc 2, dec] x6 (18)
R27-34: sc around (18)
Stuff the neck firmly. Fasten off with a long tail and sew the head on, tilted slightly down and to one side.
## Back leg (make 2)
Pink. This is the big round thigh.
R1: 6 sc in MR (6)
R2: inc around (12)
R3: [sc, inc] x6 (18)
R4: [sc 2, inc] x6 (24)
R5-9: sc around (24)
R10: [sc 2, dec] x6 (18)
R11: [sc, dec] x6 (12)
Stuff lightly.
R12: dec x6 (6)
Close the hole. Flatten a little and sew to the lower sides of the body (R4-12) so the knees point forward.
## Back foot (make 2)
Pink.
R1: 6 sc in MR (6)
R2: [sc, inc] x3 (9)
R3-6: sc around (9)
Stuff lightly, flatten, and sew under the front of each thigh, pointing forward.
## Front leg (make 2)
Pink.
R1: 6 sc in MR (6)
R2: [sc, inc] x3 (9)
R3-4: sc around (9)
R5: [sc, dec] x3 (6)
R6-10: sc around (6)
Stuff only the paw. Sew the open end to the chest at about R17-19, with the paws resting on the thighs.
## Toe (make 12)
Pink.
R1: 4 sc in MR (4)
R2: sc around (4)
Fasten off. Sew 3 toes on the front of each back foot and 3 on each front paw.
## Tail
Pink. Start at the tip.
R1: 4 sc in MR (4)
R2: sc around (4)
R3: [sc, inc] x2 (6)
R4-7: sc around (6)
R8: [sc 2, inc] x2 (8)
R9-12: sc around (8)
R13: [sc 3, inc] x2 (10)
R14-17: sc around (10)
R18: [sc 4, inc] x2 (12)
R19-22: sc around (12)
Fold the end of a pipe cleaner over so it can't poke out. Put it inside and stuff lightly around it. Sew the tail to the lower back, then curl it around to the front beside a back leg.
## Spike (make 9)
Cream.
R1: 4 sc in MR (4)
R2: [sc, inc] x2 (6)
Fasten off. Do not stuff. Sew 7 down the middle of the back of the head, neck and back. Sew 1 near the tail tip and 1 small one on the forehead.
## Wing (make 2)
Worked flat in rows. P = pink, C = cream. In rows 3-12, carry the unused color inside the stitches (tapestry crochet) so the pink ribs stay straight.
Row 1: ch 20 in pink, sc in 2nd ch from hook and across (19)
Row 2: ch 1, turn, sc across (19)
Row 3-12: ch 1, turn, sc 1 P, sc 5 C, sc 1 P, sc 5 C, sc 1 P, sc 5 C, sc 1 P (19)
Row 13: points. Ch 1, turn. With pink, sl st 1. Then repeat 3 times: [with cream, sl st 1, hdc 1, (dc, ch 2, dc) in next st, hdc 1, sl st 1; with pink, sl st 1]. You now have 3 points.
Fasten off and weave in the ends.
Pinch the short pink edge of Row 1-2 nearest the body into a narrow base. Sew it to the upper back (around R20-24), with the pink arm edge on top and the points facing down and out.`,

    pattern: `## Head
Cream yarn. Work in a spiral and don't join rounds. Move your stitch marker up every round.
R1: 6 sc in MR (6)
R2: inc x6 (12)
R3: (sc, inc) x6 (18)
R4: (2 sc, inc) x6 (24)
R5: (3 sc, inc) x6 (30)
R6: (4 sc, inc) x6 (36)
R7: (5 sc, inc) x6 (42)
R8-17: sc around (42)
Eyes now: put the safety eyes between R12 and R13, 7 stitches apart. Snap the backs on firmly.
R18: (5 sc, dec) x6 (36)
R19: (4 sc, dec) x6 (30)
R20: (3 sc, dec) x6 (24)
R21: (2 sc, dec) x6 (18)
Stuff the head firmly.
R22: (sc, dec) x6 (12)
R23: dec x6 (6)
Fasten off, close the hole and weave in the end.
## Legs (make 2)
Cream yarn. The body starts at the legs: both legs are joined together, then you crochet the body up from there.
R1: 6 sc in MR (6)
R2: inc x6 (12)
R3: (sc, inc) x6 (18)
R4: BLO sc around, this makes a flat foot (18)
R5-8: sc around (18)
Leg 1: fasten off. Leg 2: don't cut the yarn.
## Body
Cream yarn, continuing from leg 2.
R1: from leg 2, ch 2 and attach to any stitch on leg 1. Sc 18 around leg 1, sc 2 along the chain, sc 18 around leg 2, sc 2 along the other side of the chain (40)
Put your marker here: this is the new start of the round.
R2-7: sc around (40)
R8: (8 sc, dec) x4 (36)
R9-10: sc around (36)
R11: (4 sc, dec) x6 (30)
R12-13: sc around (30)
R14: (3 sc, dec) x6 (24)
R15: sc around (24)
R16: (2 sc, dec) x6 (18)
Stuff the legs and body firmly. Fasten off and leave a long tail for sewing on the head.
## Arms (make 2)
Cream yarn.
R1: 6 sc in MR (6)
R2: (sc, inc) x3 (9)
R3: (2 sc, inc) x3 (12)
R4-10: sc around (12)
Stuff only the bottom half lightly.
R11: flatten the opening and sc 6 through both layers to close it (6)
Fasten off and leave a tail for sewing.
## Ears (make 2)
Cream yarn. The ears start at the bottom tip and are wider at the bottom, like in the photo.
R1: 6 sc in MR (6)
R2: (sc, inc) x3 (9)
R3: (2 sc, inc) x3 (12)
R4: (3 sc, inc) x3 (15)
R5-18: sc around (15)
R19: (3 sc, dec) x3 (12)
R20-26: sc around (12)
Don't stuff. Flatten the ear, then sc 6 through both layers to close the top.
Fasten off and leave a tail for sewing.
## Tail
Cream yarn.
R1: 6 sc in MR (6)
R2: inc x6 (12)
R3-4: sc around (12)
Stuff a little.
R5: dec x6 (6)
Fasten off and leave a tail for sewing.
## Mushroom cap
Green dome, in sage green.
R1: 6 sc in MR (6)
R2: inc x6 (12)
R3: (sc, inc) x6 (18)
R4: (2 sc, inc) x6 (24)
R5: (3 sc, inc) x6 (30)
R6: (4 sc, inc) x6 (36)
R7: (5 sc, inc) x6 (42)
R8: (6 sc, inc) x6 (48)
R9: (7 sc, inc) x6 (54)
R10: (8 sc, inc) x6 (60)
R11: sc around (60)
R12: (9 sc, inc) x6 (66)
R13: sc around (66)
R14: (10 sc, inc) x6 (72)
R15-17: sc around (72)
Cream underside: change to cream.
R18: BLO sc around, this makes a neat folded edge (72)
R19: (10 sc, dec) x6 (66)
R20: (9 sc, dec) x6 (60)
R21: (8 sc, dec) x6 (54)
R22: (7 sc, dec) x6 (48)
R23: (6 sc, dec) x6 (42)
Fasten off and leave a long tail. The hole in the middle is where the head goes.
## Wavy ruffle
Cream yarn, a separate piece worked in rows.
Row 1: ch 73. Sc in the 2nd ch from the hook and in each ch across (72)
Row 2: ch 2 (doesn't count as a stitch), 2 hdc in each stitch across (144)
Fasten off. Sew the two short ends together to make a ring.
Sew the straight edge (row 1) around the cap underside on R19, so that the wavy edge peeks out just below the green rim.
## Forehead leaf
Brown yarn.
Row 1: ch 6. Starting in the 2nd ch from the hook: sl st, sc, hdc, dc. In the last ch: hdc, ch 2, sl st in the 2nd ch from the hook for the pointy tip, hdc. Along the other side of the chain: dc, hdc, sc, sl st.
Fasten off. Stitch a vein down the middle with dark brown or tan yarn.
## Bag pouch
Brown yarn.
R1: ch 9. Sc in the 2nd ch from the hook, sc 6, 3 sc in the last ch. Turn and work along the other side of the chain: sc 6, 2 sc in the first ch (18)
R2-7: sc around (18)
Fasten off. Don't stuff. Flatten it into a little pouch.
## Bag flap and strap
Brown yarn.
Row 1: ch 8. Sc in the 2nd ch from the hook and across (7)
Row 2-5: ch 1, turn, sc across (7)
Row 6: ch 1, turn, dec, 3 sc, dec (5)
Row 7: ch 1, turn, dec, sc, dec (3)
Sc around the whole flap edge for a neat finish. Fasten off.
Sew the straight top of the flap to the back top edge of the pouch, then fold it over the front.
Strap: ch about 60, then sl st into the back bump of each chain back down. Sew one end to each side of the pouch.

    r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  };

  const knit = (shape, color, extra = '') =>
    `<${shape} fill="${color}" ${extra}/><${shape} fill="url(#st)" ${extra}/>`;

    `ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"${rot ? ` transform="rotate(${rot} ${cx} ${cy})"` : ''}`;
  const C = (cx, cy, r) => `circle cx="${cx}" cy="${cy}" r="${r}"`;
  const P = d => `path d="${d}"`;

    : `<ellipse cx="${200 - gap}" cy="${y}" rx="9" ry="11" fill="${INK}"/><ellipse cx="${200 + gap}" cy="${y}" rx="9" ry="11" fill="${INK}"/>

        if (cm) { count = +cm[1]; body = body.slice(0, cm.index).trim(); }
        for (let n = from; n <= Math.min(to, from + 200); n++) {
          cur.items.push({ type: 'round', label: (isRow ? 'Row ' : 'R') + n, text: body, count, key: `${cur.name}|${isRow ? 'row' : 'r'}${n}` });
        }
      } else {
        cur.items.push({ type: 'note', text: line.replace(/^note:\s*/i, '') });
      }
    });
    return parts.filter(p => p.items.length);
  }
  // Clothing patterns write numbers as S (M, L), e.g. "ch 78 (86, 96)" or "(76, 84, 94)".
  // pickSize keeps only the number for the chosen size.
  const SIZE_TUPLE = /(\d+(?:-\d+)?)\s\((\d+(?:-\d+)?),\s*(\d+(?:-\d+)?)\)/g;
  const COUNT_TUPLE = /\((\d+),\s*(\d+),\s*(\d+)\)/g;
  const pickSize = (text, i) => String(text ?? '').replace(SIZE_TUPLE, (m, a, b, c) => [a, b, c][i]).replace(COUNT_TUPLE, (m, a, b, c) => `(${[a, b, c][i]})`);
  const roundsOf = parts => parts.flatMap(p => p.items.filter(i => i.type === 'round'));

  /* ---------------- toys ---------------- */
  const KIND_FOR = { bunny: 'bunny', bear: 'bear', cat: 'cat', frog: 'frog', food: 'strawberry', fantasy: 'dragon' };
  const urlCache = new Map();
  const artUrl = (art, v) => { const k = JSON.stringify(art) + v; if (!urlCache.has(k)) urlCache.set(k, Art.url(art, v)); return urlCache.get(k); };
  const sizeBucket = cm => (SIZES.find(s => cm <= s.max) || SIZES[SIZES.length - 1]).id;

  function normalize(t) {
    const toy = { ...t };
    toy.types = toy.types || []; toy.categories = toy.categories || []; toy.tags = toy.tags || []; toy.colors = toy.colors || [];
    toy.materials = toy.materials || []; toy.assembly = toy.assembly || []; toy.tricky = toy.tricky || [];
    if (!toy.art) {
      const kind = toy.types.map(x => KIND_FOR[x]).find(Boolean) || 'bear';
      const c = toy.colors.map(c => c.hex);
      toy.art = { kind, body: c[0] || '#E9D8BC', belly: kind === 'bunny' || kind === 'cat' ? null : (c[1] || '#F3EBD8'), ear: c[0], leaf: c[1] || '#5E8A5A', seed: c[2] || '#F2DC8A', wing: c[1] || '#8FAE7E', horn: '#E9D8BC', crown: c[2] || '#D9B04A', moon: c[1] || '#EBCB72', pot: c[2] || '#D9A441', yarn: c[1] || c[0] || '#8FAE7E' };
    }
    if (toy.photos && toy.photos.length) {
      toy.pics = toy.photos.map((p, i) => ({ src: p.src, alt: p.alt || `${toy.name}, photo ${i + 1}`, caption: p.caption || '' }));
    } else {
      toy.pics = (toy.photoViews || [0, 1, 2]).map(v => ({ src: artUrl(toy.art, v), alt: `${toy.name} illustration, ${Art.views[v].label}` }));
      toy.illustrated = true;
    }
    toy.parts = parsePattern(toy.sizes ? pickSize(toy.pattern, toy.defaultSize ?? 1) : toy.pattern);
    toy.sizeId = toy.sizes ? null : sizeBucket(+toy.sizeCm || 10);
    toy.hay = [toy.name, ...toy.types, ...toy.tags, ...toy.colors.map(c => c.name), ...toy.categories.map(id => (CATEGORIES.find(c => c.id === id) || {}).name || id), toy.yarn, toy.difficulty, toy.kind || ''].join(' ').toLowerCase();
    return toy;
  }
  let TOYS = [];
  function loadToys() {
    const user = store.get('ll-user-toys', {});

    TOYS = list.filter(t => !hidden.includes(t.id)).map(normalize).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  }
  const byId = id => TOYS.find(t => t.id === id);

  /* ---------------- favorites ---------------- */

  function updateFavBadges() {

  };

  const heartBtn = (t, inline = false) => {

  };
  const metaLine = t => t.sizes ? `${cap(t.difficulty)} · Sizes ${t.sizes.map(z => esc(z.label)).join(', ')} · ${esc(t.yarn)}` : `${cap(t.difficulty)} · ${esc(t.sizeCm)} cm · ${esc(t.yarn)}`;
  const cardHTML = (t, i = 0) => `
    <article class="card reveal" data-id="${esc(t.id)}" style="transition-delay:${(i % 4) * 60}ms">

  const yarnBall = () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="12" r="8"/><path d="M4 9.5c4.5-.5 9.5 1.5 13 7M6 5.5c3.5 2 6.5 6.5 7.5 13.5M11 4c1.2 4.5.3 10.5-3.5 15.7M18.5 17.5c1.3 1 2.5 1 3.5.3"/></svg>`;
  const divider = '';
  const emptyHTML = (title, text, btn) => `<div class="empty">${yarnBall()}<h3>${title}</h3><p>${text}</p>${btn || ''}</div>`;

  function toast(msg) {

    t.textContent = msg;

  /* ---------------- reveal on scroll ---------------- */
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(entries => {

  const watchReveals = root => $$('.reveal:not(.in)', root).forEach(n => io && !reduced() ? io.observe(n) : n.classList.add('in'));

  /* ---------------- collapsibles (soft ease) ---------------- */
  function setupFolds(root) {

  /* ---------------- filters ---------------- */
  const F = { q: '', cat: new Set(), type: new Set(), diff: new Set(), size: new Set(), yarn: new Set(), sort: 'new' };
  const GROUPS = [
    { key: 'cat', title: 'Category', opts: () => CATEGORIES.map(c => ({ v: c.id, label: c.name })), get: t => t.categories },
    { key: 'type', title: 'Animal or character', opts: () => [...new Set([...TYPES, ...TOYS.flatMap(t => t.types)])].map(v => ({ v, label: cap(v) })), get: t => t.types },
    { key: 'diff', title: 'Difficulty', opts: () => DIFFICULTIES.map(v => ({ v, label: cap(v) })), get: t => [t.difficulty] },
    { key: 'size', title: 'Finished size', opts: () => SIZES.map(s => ({ v: s.id, label: s.name })), get: t => t.sizeId ? [t.sizeId] : [] },
    { key: 'yarn', title: 'Yarn weight', opts: () => YARNS.map(v => ({ v, label: v })), get: t => [t.yarn] },

        const n = TOYS.filter(t => g.get(t).includes(o.v)).length;

    </div>`).join('');

  /* ---------------- views ---------------- */
  const catIcon = c => `<span class="ic" style="background:${c.color};color:${c.ink}">${I[c.icon]}</span>`;

      html: `
      <section class="hero">

            <h1>${esc(SITE.tagline)}</h1>

            <span class="caption">${esc(hero.name)} <small>New pattern</small></span>
          </a>` : ''}
        </div>
      </section>
      <section class="section" aria-labelledby="cat-h" style="padding-bottom:0">
        <div class="container">
          <div class="section-head"><h2 id="cat-h">Categories</h2></div>
          <div class="cat-row">
            ${CATEGORIES.map(c => `<a class="chip" href="#browse" data-cat="${c.id}">${esc(c.name)} <span>${TOYS.filter(t => t.categories.includes(c.id)).length}</span></a>`).join('')}
          </div>

      </section>

        </div>
      </section>`,
      mount(root) {
        $('#home-search', root).addEventListener('submit', e => { e.preventDefault(); clearFilters(); F.q = $('#hq', root).value.trim(); location.hash = 'browse'; });
        $$('[data-cat]', root).forEach(a => a.addEventListener('click', () => { clearFilters(); F.cat.add(a.dataset.cat); }));

  function viewBrowse() {
    return {
      title: `Browse patterns · ${SITE.name}`,
      html: `
      <div class="container page-head"><h1>Patterns</h1></div>
      <div class="container browse-layout">
        <aside class="filters" aria-label="Filters">
          <div class="filters-head"><h2>Filters</h2><button type="button" class="btn-link" data-clear>Clear all</button></div>
          ${groupsHTML(['_desktop'])}
        </aside>
        <div>
          <div class="filterbar" id="fbar">
            <div class="filterbar-row">
              <div class="search" role="search">
                ${I.search}
                <label class="sr-only" for="bq">Search by name, animal, color or tag</label>
                <input id="bq" type="search" placeholder="Search name, animal, color, tag" value="${esc(F.q)}" autocomplete="off" enterkeyhint="search">
                <button type="button" class="clear-search" aria-label="Clear search" ${F.q ? '' : 'hidden'}>×</button>
              </div>
              <button type="button" class="btn btn-soft filter-toggle" id="open-sheet" aria-haspopup="dialog">${I.filter}<span>Filters</span><span class="count-badge" id="fcount" hidden>0</span></button>
            </div>
            <div class="active-row" id="active-row" aria-label="Active filters"></div>
          </div>
          <div class="results-line">
            <span id="rcount" aria-live="polite"></span>
            <label class="sr-only" for="sort">Sort</label>
            <select id="sort"><option value="new">Newest</option><option value="easy">Easiest first</option><option value="az">A to Z</option></select>
          </div>

          <div id="empty"></div>

      </div>

        ${groupsHTML()}
        <div class="sheet-foot"><button type="button" class="btn btn-ghost" data-clear>Clear all</button><button type="button" class="btn btn-primary" data-close-sheet id="sheet-go">Show toys</button></div>
      </div>`,
      mount(root) {
        const grid = $('#grid', root);
        $('#sort', root).value = F.sort;
        const input = $('#bq', root), clr = $('.clear-search', root);
        const onSearch = debounce(() => { F.q = input.value.trim(); clr.hidden = !F.q; refresh(); }, 140);
        input.addEventListener('input', onSearch);
        clr.addEventListener('click', () => { input.value = ''; F.q = ''; clr.hidden = true; refresh(); input.focus(); });
        $('#sort', root).addEventListener('change', e => { F.sort = e.target.value; refresh(); });
        root.addEventListener('click', e => {
          const chip = e.target.closest('[data-f]');

        const closeSheet = () => { sheet.classList.remove('open'); bd.classList.remove('open'); document.body.style.overflow = ''; setTimeout(() => { sheet.hidden = bd.hidden = true; }, reduced() ? 0 : 380); opener.focus(); };

  // FLIP: items glide to their new spots instead of jumping

  /* ---------------- pattern page ---------------- */
  let wakeLock = null, wakeWanted = false;
  async function requestWake() {
    try {
      if (!('wakeLock' in navigator)) throw new Error('unsupported');
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; syncWake(); });
      syncWake(); return true;
    } catch { wakeLock = null; wakeWanted = false; syncWake(); return false; }
  }
  function releaseWake() { wakeWanted = false; if (wakeLock) wakeLock.release().catch(() => { }); wakeLock = null; syncWake(); }
  function syncWake() { $$('[data-wake]').forEach(b => b.setAttribute('aria-checked', !!wakeLock)); }
  document.addEventListener('visibilitychange', () => { if (wakeWanted && document.visibilityState === 'visible' && !wakeLock) requestWake(); });

  function mindMap(t) {
    const parts = t.parts, n = parts.length || 1;
    const rx = 262, ry = 182, nw = 160, nh = 58;
    const colorOf = p => {
      const txt = p.items.filter(i => i.type === 'note').map(i => i.text.toLowerCase()).join(' ');
      const hit = t.colors.map(c => ({ c, i: txt.indexOf(c.name.toLowerCase()) })).filter(x => x.i >= 0).sort((a, z) => a.i - z.i)[0];
      return (hit ? hit.c : t.colors[0] || { hex: '#E9D8BC' }).hex;
    };
    const narrow = window.innerWidth < 640;
    let W = 720, H = 500, cx = W / 2, cy = H / 2;
    if (narrow) { W = 360; cx = 180; cy = 96; H = 210 + Math.ceil(n / 2) * 72; }
    const nodes = parts.map((p, i) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / n;
      const x = narrow ? (i % 2 ? 268 : 92) : cx + rx * Math.cos(a), y = narrow ? 224 + Math.floor(i / 2) * 72 : cy + ry * Math.sin(a);
      const r = p.items.filter(i => i.type === 'round');
      const unit = r.some(x => x.label.startsWith('Row')) ? 'rows' : 'rounds';
      const name = p.name.length > 16 ? p.name.slice(0, 15) + '…' : p.name;
      return [narrow ? '' : `<path d="M${cx} ${cy} Q${(cx + x) / 2 + (y - cy) * .12} ${(cy + y) / 2 - (x - cx) * .12} ${x} ${y}" style="stroke:var(--hover-line)" stroke-width="1.5" fill="none"/>`,
        `<g transform="translate(${x - nw / 2} ${y - nh / 2})">
          <rect width="${nw}" height="${nh}" rx="18" style="fill:var(--surface);stroke:var(--line)" stroke-width="1.5"/>
          <circle cx="20" cy="${nh / 2}" r="7" fill="${colorOf(p)}" stroke="rgba(63,46,36,.2)" stroke-width="1"/>
          <text x="36" y="25" font-family="Nunito, sans-serif" font-weight="800" font-size="15" style="fill:var(--text)">${esc(name)}</text>
          <text x="36" y="43" font-family="Inter, sans-serif" font-size="12" style="fill:var(--text-soft)">${r.length ? `${r.length} ${r.length === 1 ? unit.slice(0, -1) : unit}` : 'how-to'}${p.count > 1 ? ` · make ${p.count}` : ''}</text>
        </g>`];
    });
    const nodesSvg = nodes.map(x => x[0]).join('') + nodes.map(x => x[1]).join('');
    const label = `Parts map for ${t.name}: ${parts.map(p => `${p.name}${p.count > 1 ? ` (make ${p.count})` : ''}`).join(', ')}.`;
    return `<svg class="mindmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
      <defs><clipPath id="mm-clip"><circle cx="${cx}" cy="${cy - 8}" r="62"/></clipPath></defs>
      ${nodesSvg}
      <circle cx="${cx}" cy="${cy - 8}" r="66" style="fill:var(--muted-bg)"/>
      <image href="${t.pics[0].src}" x="${cx - 62}" y="${cy - 70}" width="124" height="124" clip-path="url(#mm-clip)" preserveAspectRatio="xMidYMid slice"/>
      <rect x="${cx - 80}" y="${cy + 52}" width="160" height="32" rx="16" style="fill:var(--text)"/>
      <text x="${cx}" y="${cy + 73}" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="800" font-size="14" style="fill:var(--on-ink)">${esc(t.name.length > 20 ? t.name.slice(0, 19) + '…' : t.name)}</text>
    </svg>`;
  }

  function abbreviationsFor(t) {
    const txt = t.pattern || '';
    const tests = {
      'MR': /\bMR\b/, 'sc': /\bsc\b/, 'hdc': /\bhdc\b/, 'dc': /\bdc\b/, 'inc': /\binc\b/, 'dec': /\bdec\b/, 'BLO': /\bBLO\b/, 'FLO': /\bFLO\b/,
      'sl st': /\bsl st\b/i, 'ch': /\bch\b/, 'st': /\bsts?\b/, 'FO': /\bFO\b/, 'R': /^\s*R\d/m, 'x': /\bx\s*\d/, '( )': /\(\d+\)\s*$/m,
    };
    return Object.keys(ABBR).filter(k => tests[k] && tests[k].test(txt));
  }

  function related(t) {
    return TOYS.filter(o => o.id !== t.id).map(o => ({
      o, s: o.types.filter(x => t.types.includes(x)).length * 3 + o.categories.filter(x => t.categories.includes(x)).length * 2 + o.tags.filter(x => t.tags.includes(x)).length + (o.difficulty === t.difficulty ? .5 : 0),
    })).sort((a, b) => b.s - a.s).slice(0, 4).map(x => x.o);

  /* ---------------- make it your size ----------------
     In amigurumi the stitch counts stay the same; the finished size
     comes from the yarn weight and hook. We estimate it from typical
     amigurumi gauge (tight single crochet). */
  const SCALE = {
    'Fingering':   { st: 3.3,  hooks: [2.0, 2.25, 2.5] },
    'Sport':       { st: 3.85, hooks: [2.5, 2.75, 3.0] },
    'DK':          { st: 4.5,  hooks: [2.75, 3.0, 3.5] },
    'Worsted':     { st: 5.6,  hooks: [3.5, 3.75, 4.0] },
    'Chunky':      { st: 7.7,  hooks: [5.0, 5.5, 6.0] },
    'Super bulky': { st: 12.5, hooks: [8.0, 9.0, 10.0] },
  };
  const US_HOOK = { 2.25: 'B/1', 2.75: 'C/2', 3.25: 'D/3', 3.5: 'E/4', 3.75: 'F/5', 4.0: 'G/6', 4.5: '7', 5.0: 'H/8', 5.5: 'I/9', 6.0: 'J/10', 6.5: 'K/10.5', 8.0: 'L/11', 9.0: 'M/N-13', 10.0: 'N/P-15' };
  const EYE_SIZES = [4.5, 6, 8, 9, 10, 12, 15, 18, 20, 25, 30];
  const hookMm = s => { const m = String(s || '').match(/(\d+(?:\.\d+)?)\s*mm/); return m ? +m[1] : null; };
  const fmtHook = mm => `${mm.toFixed(mm % 0.5 ? 2 : 1)} mm${US_HOOK[mm] ? ` (US ${US_HOOK[mm]})` : ''}`;
  const midHook = y => SCALE[y].hooks[1];
  const stitchSize = (yarn, hook) => SCALE[yarn].st * (1 + 0.1 * (hook - midHook(yarn)));
  function makeBase(t) {
    const yarn = SCALE[t.yarn] ? t.yarn : 'DK';
    return { yarn, hook: hookMm(t.hook) || midHook(yarn) };
  }
  const hooksFor = (t, yarn) => {
    const b = makeBase(t);
    return [...new Set([...SCALE[yarn].hooks, ...(yarn === b.yarn ? [b.hook] : [])])].sort((a, z) => a - z);
  };
  function makeInfo(t, cfg) {
    const b = makeBase(t);
    const f = stitchSize(cfg.yarn, cfg.hook) / stitchSize(b.yarn, b.hook);
    const cm = Math.round((+t.sizeCm || 10) * f * 2) / 2;
    return { f, cm, inch: Math.round(cm / 2.54 * 10) / 10, original: cfg.yarn === b.yarn && cfg.hook === b.hook };
  }
  const snapEye = mm => EYE_SIZES.reduce((a, z) => Math.abs(z - mm) < Math.abs(a - mm) ? z : a);
  function scaleMaterial(line, cfg, info) {
    if (info.original) return line;
    let out = line;
    const g = out.match(/about (\d+(?:\.\d+)?) g\b/);
    if (!/floss|thread|embroider/i.test(out)) {
      if (g) out = out.replace(g[0], `about ${Math.max(5, Math.round(+g[1] * Math.pow(info.f, 3) / 5) * 5)} g`);
      const mt = out.match(/about (\d+(?:\.\d+)?) m\b/);
      if (mt) out = out.replace(mt[0], `about ${Math.max(5, Math.round(+mt[1] * info.f / 5) * 5)} m`);
      out = out.replace(/\b(fingering|sport|dk|worsted|chunky|super bulky)\b(\s+or\s+(light\s+)?(fingering|sport|dk|worsted|chunky))?/i, cfg.yarn);
    }
    out = out.replace(/(\d+(?:\.\d+)?)\s*mm crochet hook/i, `${fmtHook(cfg.hook)} crochet hook`);
    out = out.replace(/(\d+(?:\.\d+)?)\s*mm (black )?safety eyes/i, (m, mm, black) => `${snapEye(+mm * info.f)} mm ${black || ''}safety eyes`);
    if (/stuffing/i.test(out) && !/\d+\s*g\b/.test(out)) out += `, about ${Math.max(5, Math.round(0.0045 * Math.pow(info.cm, 3) / 5) * 5)} g`;
    return out;
  }

      mount(root) {
